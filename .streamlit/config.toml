[theme]
primaryColor        = "#00e676"
backgroundColor     = "#0a0a0c"
secondaryBackgroundColor = "#0f0f14"
textColor           = "#ffffff"
font                = "sans serif"

[server]
headless            = true
enableXsrfProtection = true

[browser]
gatherUsageStats    = false

[runner]
# Avoid unnecessary reruns on file changes in production
fastReruns = true
